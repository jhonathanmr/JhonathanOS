<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>JhonathanOS</title>
    <link rel="icon" href="data:,">
    <script src="config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="app.js"></script>
    <script type="module" src="work.js"></script>
    <style>
        /* CORRECCIÓN PRINCIPAL: Congela el scroll del navegador y fija el tamaño real */
        html, body { 
            margin: 0; 
            padding: 0; 
            height: 100dvh; 
            width: 100vw; 
            overflow: hidden; 
        }
        body { touch-action: pan-x pan-y; font-family: sans-serif; }
        
        /* CORRECCIÓN DEL CONTENEDOR: El scroll ocurre únicamente aquí dentro */
        #view-container {
            height: 100%;
            width: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .no-select { user-select: none; -webkit-user-select: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .scale-in-center {
            animation: scale-in-center 0.3s cubic-bezier(0.250, 0.460, 0.450, 0.940) both;
        }
        @keyframes scale-in-center {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="bg-slate-50 no-select">

    <!-- Se cambió a h-full para heredar el 100dvh exacto del body y se quitó el pb-24 -->
    <div id="app" class="h-full w-full flex flex-col justify-between">
        <div id="view-container"></div>
    </div>

    <!-- CORRECCIÓN DEL MENÚ: Se añade pb-[env(safe-area-inset-bottom)] para iPhone/Android modernos -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-6 pt-3 pb-[calc(0.75rem+env(safe-area-inset-bottom))] flex justify-between items-center shadow-2xl z-50">
        <button onclick="showView('gym')" class="flex flex-col items-center text-blue-600">
            <span class="text-2xl">💪</span>
            <span class="text-[10px] font-bold uppercase">Gym</span>
        </button>
        <button onclick="showView('work')" class="flex flex-col items-center gap-1 group">
            <span class="text-xl group-active:scale-125 transition-transform">🎺</span>
            <span class="text-[9px] font-black uppercase tracking-tighter text-slate-400">Work</span>
        </button>
        <button onclick="showView('academy')" class="flex flex-col items-center text-slate-400">
            <span class="text-2xl">🎓</span>
            <span class="text-[10px] font-bold uppercase">Study</span>
        </button>
    </nav>

    <div id="modal-container" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-6 hidden"></div>
</body>
</html>
