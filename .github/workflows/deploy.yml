name: Deploy JhonathanOS

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Generar archivos de configuración
        run: |
          # 1. Eliminamos cualquier rastro del archivo anterior para que no se mezclen
          rm -f config.js
          
          # 2. Creamos el archivo DESDE CERO sin la palabra export
          # IMPORTANTE: Asegúrate de que en tus Secrets de GitHub, el valor de FIREBASE_CONFIG empiece con { y termine con }
          echo "window.firebaseConfig = ${{ secrets.FIREBASE_CONFIG }};" > config.js
          
          # 3. Archivo para saltar Jekyll
          touch .nojekyll
          
          # 4. Quitamos del ignore para el deploy
          sed -i '/config.js/d' .gitignore || true
          
          # 5. Verificamos en el log qué se escribió (esto es clave para debuguear)
          echo "Contenido generado (primeros caracteres):"
          head -c 30 config.js

      - name: Desplegar a GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
          clean: true