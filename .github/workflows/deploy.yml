name: Deploy JhonathanOS

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Crear archivo config.js
        run: |
          # Generamos el archivo con el contenido del secreto
          echo "${{ secrets.FIREBASE_CONFIG }}" > config.js
          
          # Verificación de seguridad para nosotros (verás esto en los logs de GitHub)
          echo "Archivo config.js creado exitosamente."
          ls -lh config.js

      - name: Desplegar a GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .        # Sube todo lo que hay en la raíz
          branch: gh-pages # Lo envía a la rama de publicación