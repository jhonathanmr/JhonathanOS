name: Deploy JhonathanOS

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Generar archivos de configuración
        run: |
          # 1. Creamos el config.js con el secreto de Firebase
          echo "${{ secrets.FIREBASE_CONFIG }}" > config.js
          
          # 2. Creamos el .nojekyll para que GitHub no ignore archivos
          touch .nojekyll
          
          # 3. Verificamos que se crearon (esto saldrá en los logs si falla)
          ls -la config.js .nojekyll

      - name: Desplegar a GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .        # Sube todo el contenido de la raíz
          branch: gh-pages # Destino: la rama que ya tienes configurada
          clean: false     # Importante: para que no borre archivos necesarios